<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self';" />
  <title>Lumo</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="renderer.js"></script>
</head>
<body>
  <header class="chrome" aria-label="Browser controls">
    <div class="main-chrome">
      <div class="toolbar">
        <div class="nav-controls" aria-label="Navigation">
          <button class="icon-button" id="backButton" title="Go back (Alt+Left)" aria-label="Go back" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
          </button>
          <button class="icon-button" id="forwardButton" title="Go forward (Alt+Right)" aria-label="Go forward" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6" /></svg>
          </button>
          <button class="icon-button" id="reloadButton" title="Reload (Ctrl+R)" aria-label="Reload page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4" /></svg>
          </button>
        </div>

        <form class="address-form" id="addressForm" autocomplete="off">
          <span class="address-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 12h16.4M12 3.5c2.2 2.4 3.1 5.2 3.1 8.5s-.9 6.1-3.1 8.5c-2.2-2.4-3.1-5.2-3.1-8.5s.9-6.1 3.1-8.5Z"/></svg>
          </span>
          <input id="addressInput" type="text" spellcheck="false" autocapitalize="off" aria-label="Search or enter address" placeholder="Search or enter address" />
          <span class="shortcut-hint" id="shortcutHint" aria-hidden="true">CTRL L</span>
          <button class="go-button" type="submit" aria-label="Open address">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </button>
        </form>

        <div class="toolbar-tools" role="group" aria-label="Page and library tools">
          <button class="profile-button toolbar-action-button" id="bookmarkButton" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z" /></svg>
          </button>
          <span class="toolbar-tools-divider" aria-hidden="true"></span>
          <button class="profile-button toolbar-action-button" id="bookmarksButton" title="Bookmarks" aria-label="Open bookmarks">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.5L6 21V4.5Z" /></svg>
          </button>
          <button class="profile-button toolbar-action-button" id="historyButton" title="History (Ctrl+H)" aria-label="Open history">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11a8.5 8.5 0 1 1 2.1 5.9M3.5 5.5V11H9M12 7v5l3.5 2" /></svg>
          </button>
          <button class="profile-button toolbar-action-button" id="downloadsButton" title="Downloads (Ctrl+J)" aria-label="Open downloads">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m-4-4 4 4 4-4M4 17v3h16v-3" /></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
